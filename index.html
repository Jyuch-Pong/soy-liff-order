<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>豆漿訂貨</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --bg: #17181a;
    --card: #1f2123;
    --border: #34383b;
    --text: #EDEDEB;
    --text2: #9a9d9c;
    --text3: #787c7a;
    --green: #10b981;
    --green-dark: #059669;
    --amber: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Noto Sans TC", sans-serif;
    min-height: 100vh;
    padding-bottom: 100px;
    font-size: 17px;
  }
  .header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    position: sticky; top: 0; z-index: 10;
  }
  .header .code { color: var(--green); font-family: monospace; font-size: 14px; font-weight: 700; }
  .header .name { font-size: 20px; font-weight: 700; margin-top: 2px; }
  .section { padding: 12px 16px; }
  .date-row {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; display: flex; justify-content: space-between; align-items: center;
  }
  .date-row label { font-size: 16px; color: var(--text2); }
  .date-row input {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; font-size: 17px;
  }
  .product {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center;
    border-left: 5px solid var(--border);
  }
  .product.bag { border-left-color: #3b82f6; }
  .product.cup { border-left-color: #f97316; }
  .utag { display:inline-block; font-size:13px; font-weight:700; padding:1px 8px; border-radius:6px; margin-right:4px; }
  .utag.bag { background:rgba(59,130,246,.18); color:#7eb3ff; }
  .utag.cup { background:rgba(249,115,22,.18); color:#ffb27d; }
  .utag.other { background:rgba(154,157,156,.15); color:var(--text2); }
  .product .pname { font-size: 18px; font-weight: 600; }
  .product .pinfo { font-size: 15px; color: var(--text3); margin-top: 2px; }
  .product .pinfo .custom { color: var(--amber); }
  .qty { display: flex; align-items: center; gap: 8px; }
  .qty button {
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font-size: 22px; line-height: 1;
  }
  .qty button.plus { background: var(--green-dark); border-color: var(--green-dark); color: #fff; }
  .qty input.num {
    width: 64px; height: 42px; text-align: center; font-family: monospace; font-size: 20px;
    background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 10px;
  }
  .qty input.num::-webkit-outer-spin-button, .qty input.num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card); border-top: 1px solid var(--border); padding: 12px 16px;
  }
  .submit {
    width: 100%; padding: 16px; border-radius: 12px; border: none;
    background: var(--green-dark); color: #fff; font-size: 18px; font-weight: 700;
  }
  .submit:disabled { background: #2a2d30; color: #54585a; }
  .center { text-align: center; padding: 60px 20px; color: var(--text2); font-size: 14px; }
  .success {
    text-align: center; padding: 60px 24px;
  }
  .success .icon { font-size: 48px; margin-bottom: 12px; }
  .success .title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .success .detail { font-size: 13px; color: var(--text2); line-height: 1.7; }
</style>
</head>
<body>
<div id="app"><div class="center">載入中…</div></div>

<script>
// ====== 設定 ======
const LIFF_ID = "2010732511-OcnAZuRv";
const API_URL = "https://whwhufkehoxgrrwacqjv.supabase.co/functions/v1/liff-api";

// ====== 狀態 ======
let store = null;
let products = [];
let cart = {};        // productId -> qty
let deliveryDate = "";
let groupId = "";
let editOrderId = ""; // 有值=編輯既有訂單模式
let viewOrders = false; // true=歷史訂單查詢模式
let history = null;
let giftCart = {};  // productId -> 贈品數量
let deliveryWeekdays = null; // 該店固定配送星期,如[1,4]
let giftRules = [];          // 搭贈規則:買X滿N送Y

const app = document.getElementById("app");

function weekdayName(dateStr) {
  return new Intl.DateTimeFormat("zh-TW", { timeZone: "Asia/Taipei", weekday: "short" })
    .format(new Date(dateStr + "T12:00:00+08:00"));
}
function isOffDay(dateStr) {
  if (!deliveryWeekdays || !dateStr) return false;
  const wd = new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Taipei", weekday: "short" })
    .format(new Date(dateStr + "T12:00:00+08:00"));
  const map = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
  return !deliveryWeekdays.includes(map[wd]);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

// 依搭贈規則計算各品項可得贈品數
function giftInfo() {
  const allow = {};   // productId -> 可得數量
  for (const r of giftRules) {
    const bought = cart[r.buyProductId] || 0;
    if (!r.buyQty || r.buyQty <= 0) continue;
    const n = Math.floor(bought / r.buyQty);
    if (n > 0) allow[r.giftProductId] = (allow[r.giftProductId] || 0) + n;
  }
  const selected = {};
  for (const [pid, q] of Object.entries(giftCart)) if (q > 0) selected[pid] = q;
  const totalAllow = Object.values(allow).reduce((s, n) => s + n, 0);
  const totalSel = Object.values(selected).reduce((s, n) => s + n, 0);
  return { allow, selected, totalAllow, totalSel };
}

function cartTotal() {
  let t = 0;
  for (const p of products) {
    const q = cart[p.id] || 0;
    t += q * p.price;
  }
  return t;
}
function cartCount() {
  return Object.values(cart).filter(q => q > 0).length;
}

function renderHistory() {
  const statusBadge = (o) => {
    if (o.status === "cancelled") return '<span style="color:var(--red);font-size:13px;border:1px solid var(--red);border-radius:99px;padding:1px 8px">已取消</span>';
    if (o.status === "delivered") return '<span style="color:#60a5fa;font-size:13px;border:1px solid #60a5fa;border-radius:99px;padding:1px 8px">已送達</span>';
    return '<span style="color:var(--green);font-size:13px;border:1px solid var(--green);border-radius:99px;padding:1px 8px">已成立</span>';
  };
  app.innerHTML = `
    <div class="header">
      <div class="code">[${esc(store.code)}]</div>
      <div class="name">${esc(store.name)} <span style="color:var(--text2);font-size:15px">訂單查詢</span></div>
    </div>
    <div class="section">
      <div style="background:var(--card);border:1px solid var(--green-dark);border-radius:12px;padding:14px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="color:var(--text2)">本月累計(${history.monthLabel},已配送)</span>
          <b style="font-size:22px;color:var(--green)">$${history.monthTotal.toLocaleString()}</b>
        </div>
        ${history.pendingTotal>0?`
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
          <span style="color:var(--text2)">未配送訂單</span>
          <b style="font-size:17px;color:var(--amber)">$${history.pendingTotal.toLocaleString()}</b>
        </div>`:""}
      </div>
      <div style="color:var(--text3);font-size:13px;margin:6px 2px 0">顯示最近30天訂單,依配送日排序</div>
    </div>
    <div class="section" style="padding-top:0">
      ${history.orders.length===0?'<div style="color:var(--text3);text-align:center;padding:40px 0">最近30天沒有訂單</div>':""}
      ${history.orders.map(o=>{
        const [, mm, dd] = o.deliveryDate.split("-");
        return `
        <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;${o.status==='cancelled'?'opacity:.5':''}">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <b>配送 ${mm}/${dd}</b>
            ${statusBadge(o)}
          </div>
          <div style="margin-top:8px">
            ${o.items.map(it=>`<div style="display:flex;justify-content:space-between;font-size:15px;color:var(--text2);padding:2px 0"><span>${esc(it.name)}${it.isGift?'<span style="color:#7eb3ff;font-size:13px"> 🎁贈</span>':""}</span><span style="font-family:monospace">${it.qty}${it.isGift?"":` × $${it.price}`}</span></div>`).join("")}
          </div>
          <div style="text-align:right;font-weight:700;margin-top:6px;font-size:17px">$${o.total.toLocaleString()}</div>
        </div>`}).join("")}
    </div>`;
}

function render() {
  const total = cartTotal();
  app.innerHTML = `
    <div class="header">
      <div class="code">[${esc(store.code)}]</div>
      <div class="name">${esc(store.name)}${editOrderId?' <span style="color:var(--amber);font-size:15px">(修改今日訂單)</span>':""}</div>
    </div>
    ${editOrderId?`
    <div class="section" style="padding-bottom:0">
      <div style="background:rgba(245,158,11,.12);border:1px solid var(--amber);color:var(--amber);
                  border-radius:10px;padding:10px 12px;font-size:15px">
        📝 這天已經有訂單了,以下為目前的訂購內容,直接修改即可(數量改0=取消該品項)
      </div>
    </div>`:""}
    <div class="section">
      <div class="date-row">
        <label>配送日期${editOrderId?'(修改中不可改)':''}</label>
        <input type="date" id="ddate" value="${deliveryDate}" ${editOrderId?'disabled':''} />
      </div>
      ${(!editOrderId && isOffDay(deliveryDate)) ? `
        <div style="background:rgba(245,158,11,.12);border:1px solid var(--amber);color:var(--amber);
                    border-radius:10px;padding:10px 12px;margin-top:8px;font-size:15px">
          ⚠️ ${deliveryDate.slice(5).replace("-","/")}(${weekdayName(deliveryDate)})不是貴店的固定配送日<br/>
          <span style="font-size:14px">固定配送:${store.dayGroup||"未設定"};如需此日配送請與我們確認</span>
        </div>` : ""}
    </div>
    ${(()=>{
      const g = giftInfo();
      if (!g.totalAllow) return "";
      const pname = (id)=>{ const p = products.find(x=>x.id===id); return p ? p.name : "?"; };
      const punit = (id)=>{ const p = products.find(x=>x.id===id); return p ? p.unit : ""; };
      return `<div class="section" style="padding-bottom:0">
        <div style="background:rgba(59,130,246,.10);border:1px solid #3b82f6;border-radius:12px;padding:12px 14px">
          <b style="color:#7eb3ff">🎁 搭贈</b>
          ${Object.entries(g.allow).map(([pid, n])=>{
            const sel = g.selected[pid] || 0;
            return `
            <div style="margin-top:10px;font-size:16px">
              可送 <b style="color:#7eb3ff">${esc(pname(pid))}</b> ${n} ${esc(punit(pid))}
              ${sel<n?`<span style="color:var(--amber);font-size:15px">(還可拿 ${n-sel})</span>`
                     :`<span style="color:var(--green);font-size:15px">✓ 已選滿</span>`}
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0">
              <span style="font-size:16px">${esc(pname(pid))} <span style="color:var(--text3);font-size:14px">${esc(punit(pid))}</span></span>
              <span style="display:flex;align-items:center;gap:8px">
                <button onclick="chgGift('${pid}',-1)" style="width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:18px">−</button>
                <span style="min-width:26px;text-align:center;font-family:monospace;font-size:19px;color:${sel?'#7eb3ff':'var(--text3)'}">${sel}</span>
                <button onclick="chgGift('${pid}',1)" style="width:36px;height:36px;border-radius:50%;border:1px solid #3b82f6;background:rgba(59,130,246,.2);color:#7eb3ff;font-size:18px">＋</button>
              </span>
            </div>`}).join("")}
        </div>
      </div>`;
    })()}
    <div class="section" style="padding-top:0">
      ${products.map(p => `
        <div class="product ${p.unit.includes('袋')?'bag':p.unit.includes('杯')?'cup':''}">
          <div>
            <div class="pname">${esc(p.name)}</div>
            <div class="pinfo"><span class="utag ${p.unit.includes('袋')?'bag':p.unit.includes('杯')?'cup':'other'}">${esc(p.unit)}</span> $${p.price}${p.isCustom ? ' <span class="custom">(專屬價)</span>' : ""}</div>
          </div>
          <div class="qty">
            <button onclick="chg('${p.id}',-1)">−</button>
            <input class="num" type="number" inputmode="numeric" min="0" value="${cart[p.id] || 0}"
              onchange="setQty('${p.id}',this.value)" onfocus="this.select()" />
            <button class="plus" onclick="chg('${p.id}',1)">＋</button>
          </div>
        </div>
      `).join("")}
    </div>
    <div class="footer">
      <button class="submit" id="submitBtn" ${cartCount() === 0 ? "disabled" : ""} onclick="submitOrder()">
        ${cartCount() === 0 ? "請選擇品項" : editOrderId ? `更新訂單 · $${total}` : `送出訂單 · $${total}`}
      </button>
    </div>
  `;
  document.getElementById("ddate").addEventListener("change", (e) => {
    deliveryDate = e.target.value;
    render(); // 重繪以更新非配送日提醒
  });
}

window.chg = function (pid, d) {
  cart[pid] = Math.max(0, (cart[pid] || 0) + d);
  render();
};

window.chgGift = function (pid, d) {
  const g = giftInfo();
  const max = g.allow[pid] || 0;
  const cur = giftCart[pid] || 0;
  if (d > 0 && cur >= max) { alert(`此品項最多可拿 ${max} 個`); return; }
  giftCart[pid] = Math.max(0, cur + d);
  if (!giftCart[pid]) delete giftCart[pid];
  render();
};

window.setQty = function (pid, v) {
  cart[pid] = Math.max(0, Math.floor(Number(v) || 0));
  render();
};

let submitting = false; // 防連點重複送出
window.submitOrder = async function () {
  if (submitting) return;
  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "送出中…";

  const items = Object.entries(cart)
    .filter(([, q]) => q > 0)
    .map(([productId, quantity]) => ({ productId, quantity }));
  for (const [productId, quantity] of Object.entries(giftCart)) {
    if (quantity > 0) items.push({ productId, quantity, isGift: true });
  }
  // 提醒但不強制:可拿贈品卻沒拿滿
  const gi = giftInfo();
  if (gi.totalAllow > gi.totalSel) {
    if (!confirm(`您還有 ${gi.totalAllow - gi.totalSel} 個贈品未選,確定直接送出?`)) {
      btn.disabled = false;
      btn.textContent = "送出訂單";
      return;
    }
  }
  submitting = true;
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ groupId, deliveryDate, items, ...(editOrderId?{orderId:editOrderId}:{}) }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || "下單失敗");

    const [, mm, dd] = deliveryDate.split("-");
    app.innerHTML = `
      <div class="success">
        <div class="icon">✅</div>
        <div class="title">${editOrderId?'訂單已更新':'訂單已送出'}</div>
        <div class="detail">
          配送日 ${mm}/${dd}<br/>
          合計 $${data.total}<br/><br/>
          可直接關閉此頁面(輸入「訂單」可隨時查詢)
        </div>
      </div>
    `;
    // 3秒後自動關閉LIFF視窗
    setTimeout(() => { if (liff.isInClient()) liff.closeWindow(); }, 3000);
  } catch (e) {
    alert("下單失敗:" + e.message);
    btn.disabled = false;
    btn.textContent = "送出訂單";
  } finally {
    submitting = false;
  }
};

// ====== 啟動 ======
(async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });

    // 取得groupId:優先從liff.state/網址參數拿
    const params = new URLSearchParams(location.search);
    groupId = params.get("groupId") || "";
    editOrderId = params.get("editOrder") || "";
    viewOrders = params.get("view") === "orders";
    if (params.get("liff.state")) {
      const stateParams = new URLSearchParams(params.get("liff.state").replace(/^\?/, ""));
      if (!groupId) groupId = stateParams.get("groupId") || "";
      if (!editOrderId) editOrderId = stateParams.get("editOrder") || "";
      if (!viewOrders) viewOrders = stateParams.get("view") === "orders";
    }
    if (!groupId) {
      app.innerHTML = '<div class="center">無法取得群組資訊,請從群組內的「叫貨」按鈕開啟</div>';
      return;
    }

    const extraParam = viewOrders ? "&view=orders"
      : (editOrderId ? `&editOrder=${encodeURIComponent(editOrderId)}` : "");
    const res = await fetch(`${API_URL}?groupId=${encodeURIComponent(groupId)}${extraParam}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "載入失敗");

    store = data.store;
    deliveryWeekdays = data.deliveryWeekdays || null;
    giftRules = data.giftRules || [];
    if (viewOrders) {
      history = data.history;
      renderHistory();
      return;
    }
    products = data.products;
    if (data.editOrder) {
      // 關鍵:記下訂單ID,送出時才會走「更新既有訂單」而非建立新訂單
      editOrderId = data.editOrder.id;
      // 編輯模式:帶入原訂單品項與配送日,日期鎖定不可改
      deliveryDate = data.editOrder.deliveryDate;
      for (const it of data.editOrder.items) {
        if (it.isGift) giftCart[it.productId] = it.quantity;
        else cart[it.productId] = it.quantity;
      }
    } else {
      editOrderId = "";
      deliveryDate = data.defaultDeliveryDate;
    }
    render();
  } catch (e) {
    app.innerHTML = `<div class="center">載入失敗:${esc(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
