<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>司機配送</title>
<style>
  :root {
    --bg:#17181a; --card:#1f2123; --border:#34383b; --text:#EDEDEB;
    --text2:#9a9d9c; --text3:#787c7a; --green:#10b981; --green-d:#059669;
    --amber:#f59e0b; --red:#f43f5e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,"Noto Sans TC",sans-serif;font-size:16px;padding-bottom:20px}
  .topbar{background:var(--green-d);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:10}
  .topbar .name{font-weight:700;font-size:17px}
  .topbar .sub{font-size:14px;opacity:.85;margin-top:2px}
  .bar2{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  input,select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:16px}
  input[type=date]{color-scheme:dark}
  .wrap{padding:12px;max-width:560px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
  .scard{border-radius:12px;border:2px solid;padding:12px;margin-bottom:10px}
  .s-green{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.45)}
  .s-red{background:rgba(244,63,94,.08);border-color:rgba(244,63,94,.45)}
  .s-done{background:rgba(16,185,129,.04);border-color:rgba(16,185,129,.2);opacity:.75}
  .mono{font-family:monospace}
  .green{color:var(--green)} .amber{color:var(--amber)} .red{color:var(--red)} .dim{color:var(--text3)}
  .badge{font-size:13px;padding:2px 8px;border-radius:99px;border:1px solid;white-space:nowrap}
  .b-green{color:var(--green);border-color:var(--green)}
  .b-red{color:var(--red);border-color:var(--red)}
  .b-amber{color:var(--amber);border-color:var(--amber)}
  .b-blue{color:#60a5fa;border-color:#60a5fa}
  button.btn{background:var(--green-d);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:15px;font-weight:600}
  button.btn-red{background:var(--red);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:15px;font-weight:600}
  button.btn2{background:none;color:var(--text2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:14px}
  .full{width:100%}
  .login{max-width:300px;margin:110px auto;text-align:center}
  .login input{width:100%;margin:8px 0;padding:11px}
  .login button{width:100%;padding:11px;margin-top:8px}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th{color:var(--text2);text-align:left;font-weight:500;padding:5px 6px;border-bottom:1px solid var(--border)}
  td{padding:6px;border-bottom:1px solid #2a2d30}
  tr:last-child td{border-bottom:none}
  .oitem{font-size:17px;color:var(--text);display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #26292b}
  .oitem:last-child{border-bottom:none}
  .oitem .nm{display:flex;align-items:center;gap:6px}
  .oitem .qt{font-family:monospace;font-size:18px;font-weight:700}
  .tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
  .tbox{border-radius:12px;padding:10px 12px;border:2px solid}
  .tbox.bag{background:rgba(59,130,246,.10);border-color:rgba(59,130,246,.55)}
  .tbox.cup{background:rgba(249,115,22,.10);border-color:rgba(249,115,22,.55)}
  .tbox.other{background:rgba(154,157,156,.08);border-color:var(--border)}
  .tbox .tname{font-size:16px;font-weight:600;line-height:1.3}
  .tbox .tqty{font-family:monospace;font-size:26px;font-weight:800;margin-top:4px}
  .tbox.bag .tqty{color:#7eb3ff} .tbox.cup .tqty{color:#ffb27d} .tbox.other .tqty{color:var(--text)}
  .tbox .tsub{font-size:13px;color:var(--text3);margin-top:2px}
  .dbox{border-radius:12px;padding:12px 14px;border:2px solid rgba(245,158,11,.5);background:rgba(245,158,11,.08);margin-top:8px}
  .dhead{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid rgba(245,158,11,.3)}
  .dhead .dname{font-size:17px;font-weight:700}
  .dhead .dsum{font-family:monospace;font-size:22px;font-weight:800;color:var(--amber)}
  .drow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:15px}
  .drow .dp{font-family:monospace;color:var(--text2);min-width:96px}
  .drow .dp s{color:var(--text3)}
  .drow .dp b{color:var(--amber)}
  .drow .dq{font-family:monospace;flex:1;text-align:center;color:var(--text)}
  .drow .ds{font-family:monospace;font-weight:700;color:var(--amber);min-width:64px;text-align:right}
  .oitem{font-size:17px;color:var(--text);display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #26292b}
  .oitem:last-child{border-bottom:none}
  .oitem .nm{display:flex;align-items:center;gap:6px}
  .oitem .qt{font-family:monospace;font-size:18px;font-weight:700}
  .tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
  .tbox{border-radius:12px;padding:10px 12px;border:2px solid}
  .tbox.bag{background:rgba(59,130,246,.10);border-color:rgba(59,130,246,.55)}
  .tbox.cup{background:rgba(249,115,22,.10);border-color:rgba(249,115,22,.55)}
  .tbox.other{background:rgba(154,157,156,.08);border-color:var(--border)}
  .tbox .tname{font-size:16px;font-weight:600;line-height:1.3}
  .tbox .tqty{font-family:monospace;font-size:26px;font-weight:800;margin-top:4px}
  .tbox.bag .tqty{color:#7eb3ff} .tbox.cup .tqty{color:#ffb27d} .tbox.other .tqty{color:var(--text)}
  .tbox .tsub{font-size:13px;color:var(--text3);margin-top:2px}
  .dbox{border-radius:12px;padding:10px 12px;border:2px solid rgba(245,158,11,.5);background:rgba(245,158,11,.08)}
  .dbox .dname{font-size:16px;font-weight:600;line-height:1.3}
  .dbox .dprice{font-size:14px;color:var(--text2);margin-top:3px;font-family:monospace}
  .dbox .dprice s{color:var(--text3)}
  .dbox .dprice b{color:var(--amber)}
  .dbox .dcalc{font-size:13px;color:var(--text3);margin-top:2px;font-family:monospace}
  .dbox .dsum{font-family:monospace;font-size:24px;font-weight:800;color:var(--amber);margin-top:4px}
  .qtyrow{display:flex;justify-content:space-between;align-items:center;padding:5px 0}
  .qtyrow .ctrl{display:flex;align-items:center;gap:10px}
  .qtyrow button{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:18px}
  .qtyrow button.p{background:var(--green-d);border-color:var(--green-d);color:#fff}
  .qtyrow input.n{width:56px;height:36px;text-align:center;font-family:monospace;font-size:16px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px}
  .qtyrow input.n::-webkit-outer-spin-button,.qtyrow input.n::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  details summary{cursor:pointer;padding:4px 0}
  .utag{display:inline-block;font-size:14px;font-weight:700;padding:1px 8px;border-radius:6px;margin-right:2px}
  .utag.bag{background:rgba(59,130,246,.18);color:#7eb3ff}
  .utag.cup{background:rgba(249,115,22,.18);color:#ffb27d}
  .utag.other{background:rgba(154,157,156,.15);color:var(--text2)}
  .addr{font-size:14px;color:var(--text2);margin-top:2px}
  a.navlink{display:inline-block;color:#60a5fa;text-decoration:none;border-bottom:1px dotted rgba(96,165,250,.5)}
  .ordersum{display:flex;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
  .sumchip{font-size:15px;padding:4px 12px;border-radius:99px;border:1px solid}
  .sumchip b{font-family:monospace;font-size:18px}
  .sumchip.bag{color:#7eb3ff;border-color:rgba(59,130,246,.6);background:rgba(59,130,246,.10)}
  .sumchip.cup{color:#ffb27d;border-color:rgba(249,115,22,.6);background:rgba(249,115,22,.10)}
  .giftbadge{margin-left:6px;font-size:13px;font-weight:700;color:#7eb3ff;background:rgba(59,130,246,.15);border-radius:6px;padding:1px 7px}
  .exrow{display:flex;justify-content:space-between;align-items:center;font-size:15px;padding:4px 0;color:var(--text2)}
  .exbox{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
  .rowbtns{display:flex;gap:8px;margin-top:10px}
  .rowbtns button{flex:1}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ====== 設定 ======
const API = "https://whwhufkehoxgrrwacqjv.supabase.co/functions/v1/driver-api";
// 每籃(K)數量設定:單位含「袋」=6袋/籃、含「杯」=24杯/籃
const PER_BASKET = { bag: 6, cup: 24 };
function unitClass(u){ u=u||""; return u.includes("袋")?"bag":u.includes("杯")?"cup":"other"; }
// 換算籃數:10袋→1K4、30杯→1K6、12袋→2K、4袋→4
function toBasket(qty, unit){
  const c = unitClass(unit);
  const per = PER_BASKET[c];
  if (!per || qty < per) return { main: String(qty), sub: "" };
  const k = Math.floor(qty/per), r = qty%per;
  return { main: r ? `${k}K${r}` : `${k}K`, sub: `${qty} ${unit}` };
}

let CRED = JSON.parse(sessionStorage.getItem("driverCred")||"null"); // {account,password,name,car_no}
let viewDate = todayTW();
let data = null;        // today回傳的資料
let builder = null;     // {storeId, mode:'new'|'addon', orderId?, cart:{}}

const app = document.getElementById("app");

function todayTW(){ return new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Taipei"}); }
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function weekdayTW(dateStr){
  return new Intl.DateTimeFormat("zh-TW",{timeZone:"Asia/Taipei",weekday:"short"}).format(new Date(dateStr+"T12:00:00+08:00"));
}

async function api(action, opts={}){
  const url = new URL(API);
  url.searchParams.set("action", action);
  for (const [k,v] of Object.entries(opts.params||{})) url.searchParams.set(k,v);
  const res = await fetch(url, {
    method: opts.body||action==="login" ? "POST":"GET",
    headers: {
      "x-driver-account": CRED?.account||"",
      "x-driver-password": CRED?.password||"",
      ...(opts.body?{"Content-Type":"application/json"}:{}),
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const d = await res.json();
  if (res.status===401 && action!=="login"){ logout(); throw new Error("unauthorized"); }
  if (!res.ok) throw new Error(d.error||"error");
  return d;
}

// ====== 登入 ======
function renderLogin(msg){
  app.innerHTML = `
    <div class="login">
      <h2>🚚 司機配送系統</h2>
      ${msg?`<div class="red" style="margin-top:8px">${esc(msg)}</div>`:""}
      <input id="acc" placeholder="帳號" autocomplete="username" />
      <input id="pw" type="password" placeholder="密碼" autocomplete="current-password" />
      <button class="btn" onclick="doLogin()">登入</button>
    </div>`;
  document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
}
window.doLogin = async function(){
  const account = document.getElementById("acc").value.trim();
  const password = document.getElementById("pw").value;
  CRED = { account, password };
  try {
    const r = await api("login",{body:{}});
    CRED.name = r.driver.name; CRED.car_no = r.driver.car_no;
    sessionStorage.setItem("driverCred", JSON.stringify(CRED));
    load();
  } catch(e){ CRED=null; renderLogin(e.message==="unauthorized"?"帳號或密碼錯誤":e.message); }
};
function logout(){ CRED=null; sessionStorage.removeItem("driverCred"); renderLogin(); }
window.logout = logout;

// ====== 主畫面 ======
async function load(focusStoreId){
  if (!focusStoreId) app.innerHTML = `<div class="wrap dim">載入中…</div>`;
  try {
    data = await api("today",{params:{date:viewDate}});
    render();
    // 捲回原本看的那間店(送達後明細會收合、版面高度改變,用元素定位比像素可靠)
    const target = focusStoreId || sessionStorage.getItem("driverFocus");
    if (target) {
      const el = document.getElementById("s-" + target);
      if (el) {
        el.scrollIntoView({ block: "center" });
        requestAnimationFrame(()=>el.scrollIntoView({ block: "center" }));
      }
    }
  } catch(e){
    if (String(e.message)!=="unauthorized")
      app.innerHTML = `<div class="wrap red">載入失敗:${esc(e.message)}</div>`;
  }
}

function render(){
  const done = data.stores.filter(s=>s.order).length;
  app.innerHTML = `
    <div class="topbar">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div class="name">🚚 ${esc(CRED.name)} <span style="font-weight:400;font-size:14px;opacity:.85">${esc(CRED.car_no||"")}</span></div>
          <div class="sub">${viewDate}(${weekdayTW(viewDate)}) · 路線 ${data.routes.join("、")||"無"} · 梯次 ${esc(data.dayGroup||"-")}</div>
        </div>
        <button class="btn2" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="logout()">登出</button>
      </div>
    </div>
    <div class="bar2">
      <input type="date" value="${viewDate}" onchange="chgDate(this.value)" />
      <span class="green" style="font-weight:700">${done}/${data.stores.length} 已下單</span>
    </div>
    <div class="wrap">
      ${renderTotals()}
      ${renderDiscounts()}
      ${(data.extraStores&&data.extraStores.length)?`
        <div class="card" style="border-color:var(--amber)">
          <b class="amber">⚠️ 非配送日訂單(${data.extraStores.length})</b>
          <div class="dim" style="font-size:14px;margin:4px 0 8px">這些店家今天不是他們的配送梯次,但有指定今天配送的訂單,請記得送</div>
          ${data.extraStores.map(s=>renderStore(s,true)).join("")}
        </div>`:""}
      ${data.stores.length===0?'<div class="card dim">此日期無配送店家</div>':""}
      ${data.stores.map(s=>renderStore(s,false)).join("")}
    </div>`;
}

function renderTotals(){
  if (!data.totals.length) return "";
  return `
    <div class="card">
      <details open>
        <summary><b>📦 當日品項總計</b></summary>
        <div class="tgrid">
          ${data.totals.map(t=>{
            const c = unitClass(t.unit);
            const b = toBasket(t.qty, t.unit);
            return `<div class="tbox ${c}">
              <div class="tname">${esc(t.name)}</div>
              <div class="tqty">${b.main}${b.sub?"":`<span style="font-size:15px;font-weight:600"> ${esc(t.unit)}</span>`}</div>
              <div class="tsub">${b.sub?esc(b.sub)+" · ":""}${t.storeCount} 間店</div>
            </div>`}).join("")}
        </div>
      </details>
    </div>`;
}

function renderDiscounts(){
  if (!data.discounts) return ""; // 後端未提供(driver-api未更新)
  if (!data.discounts.length) {
    return `<div class="card">
      <b class="dim">💰 今日折讓統計</b>
      <div class="dim" style="font-size:14px;margin-top:4px">今日訂單皆為原價,無折讓</div>
    </div>`;
  }
  // 同品項(名稱+單位)歸為一組,組內列出各優惠價
  const groups = {};
  for (const x of data.discounts){
    const key = x.name + "|" + x.unit;
    if (!groups[key]) groups[key] = { name:x.name, unit:x.unit, rows:[], sum:0 };
    groups[key].rows.push(x);
    groups[key].sum += x.subtotal;
  }
  const list = Object.values(groups).sort((a,b)=>b.sum-a.sum);
  return `
    <div class="card" style="border-color:var(--amber)">
      <details open>
        <summary style="display:flex;justify-content:space-between;align-items:center">
          <b class="amber">💰 今日折讓統計</b>
          <b class="amber" style="font-size:22px">-$${data.discountTotal.toLocaleString()}</b>
        </summary>
        ${list.map(g=>`
          <div class="dbox">
            <div class="dhead">
              <span class="dname"><span class="utag ${unitClass(g.unit)}">${esc(g.unit)}</span>${esc(g.name)}</span>
              <span class="dsum">-$${g.sum.toLocaleString()}</span>
            </div>
            ${g.rows.sort((a,b)=>b.subtotal-a.subtotal).map(x=>`
              <div class="drow">
                <span class="dp"><s>$${x.base}</s>→<b>$${x.price}</b></span>
                <span class="dq">${x.qty} ${esc(x.unit)} × $${x.diff}</span>
                <span class="ds">-$${x.subtotal.toLocaleString()}</span>
              </div>`).join("")}
          </div>`).join("")}
        <div class="dim" style="font-size:13px;margin-top:8px">※ 單價低於商品基礎價者列入;同品項不同優惠價分列計算</div>
      </details>
    </div>`;
}

function renderStore(s, isExtra){
  const ordered = !!s.order;
  const delivered = ordered && s.order.status==="delivered";
  const cls = delivered ? "s-done" : ordered ? "s-green" : "s-red";
  const isBuilding = builder && builder.storeId===s.id;
  return `
    <div class="scard ${cls}" id="s-${s.id}" ${isExtra?'style="border-style:dashed"':""}>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div>
          <span class="mono dim" style="font-size:13px;font-weight:700">${esc(s.store_code)}</span>
          <b style="margin-left:4px">${esc(s.name)}</b>
          ${isExtra?`<span class="badge b-amber" style="margin-left:4px">梯次 ${esc(s.day_group||"?")}</span>`:""}
          ${s.address?`<a class="addr navlink" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(s.address)}" target="_blank" rel="noopener">📍 ${esc(s.address)} <span style="font-size:13px">▸導航</span></a>`:""}
          ${s.note?`<div class="addr" style="color:var(--amber)">📝 ${esc(s.note)}</div>`:""}
        </div>
        ${delivered?'<span class="badge b-blue">✓ 已送達</span>'
          :ordered?(s.order.status==='provisional'
             ?'<span class="badge b-amber">📦 預抓(未確認)</span>'
             :'<span class="badge b-green">已訂貨</span>')
          :'<span class="badge b-red">未訂貨</span>'}
      </div>

      ${ordered ? `
        <details style="margin-top:8px" ${delivered?"":"open"}>
          <summary style="display:flex;justify-content:space-between">
            <span class="dim" style="font-size:14px">訂貨明細 ${s.order.source==='on_site'?'<span class="badge b-amber">現場建單</span>':""}</span>
            <b>$${s.order.total.toLocaleString()}</b>
          </summary>
          <div style="margin-top:6px">
            ${s.order.items.map(it=>{
              const u = it.unit||"";
              const c = u.includes('袋')?'bag':u.includes('杯')?'cup':'other';
              return `<div class="oitem">
                <span class="nm"><span class="utag ${c}">${esc(u)}</span>${esc(it.name)}${it.isGift?'<span class="giftbadge">🎁贈品</span>':""}</span>
                <span class="qt">${it.qty}<span style="font-size:14px;color:var(--text3);font-weight:400">${it.isGift?" (不計價)":` × $${it.price}`}</span></span>
              </div>`}).join("")}
            ${(()=>{
              let bag=0, cup=0;
              for (const it of s.order.items){
                const u = it.unit||"";
                const n = it.qty;
                if (u.includes('袋')) bag += n;
                else if (u.includes('杯')) cup += n;
              }
              // 換貨補的新品也要帶
              for (const e of (s.exchanges||[])){
                const u = e.unit||"";
                if (u.includes('袋')) bag += e.replaced;
                else if (u.includes('杯')) cup += e.replaced;
              }
              if (!bag && !cup) return "";
              const chip = (label,n,cls)=>{
                const b = toBasket(n, cls==='bag'?'袋':'杯');
                return `<span class="sumchip ${cls}">${label} <b>${b.main}</b>${b.sub?`<span style="font-size:13px;opacity:.75"> (${n})</span>`:""}</span>`;
              };
              return `<div class="ordersum">
                ${bag?chip("袋裝合計",bag,"bag"):""}
                ${cup?chip("杯裝合計",cup,"cup"):""}
              </div>`;
            })()}
          </div>
        </details>
        ${!isBuilding ? `
          ${(s.exchanges&&s.exchanges.length)?`<div class="exbox">
            ${s.exchanges.map(e=>`<div class="exrow">
              <span>🔄 ${esc(e.name)} <span class="dim">${esc(e.unit)}</span></span>
              <span class="mono">回收${e.returned} / 補${e.replaced}</span>
            </div>`).join("")}
          </div>`:""}
          <div class="rowbtns">
            ${!delivered?`<button class="btn2" onclick="openExchange('${s.id}')">🔄 換貨</button>`:""}
            ${!delivered?`<button class="btn2" onclick="openEditBuilder('${s.id}','${s.order.id}')">✎ 編輯</button>`:""}
            ${!delivered?`<button class="btn2" onclick="openBuilder('${s.id}','addon','${s.order.id}')">＋ 追加</button>`:""}
            ${!delivered?`<button class="btn" onclick="markDelivered('${s.order.id}','${s.id}')">✓ 送達</button>`:""}
          </div>`:""}
      ` : `
        ${(s.exchanges&&s.exchanges.length)?`<div class="exbox">
          ${s.exchanges.map(e=>`<div class="exrow">
            <span>🔄 ${esc(e.name)} <span class="dim">${esc(e.unit)}</span></span>
            <span class="mono">回收${e.returned} / 補${e.replaced}</span>
          </div>`).join("")}
        </div>`:""}
        ${!isBuilding?`<div class="rowbtns" style="margin-top:10px">
          <button class="btn2" onclick="openExchange('${s.id}')">🔄 換貨</button>
          <button class="btn2" onclick="openBuilder('${s.id}','pre')">📦 預抓</button>
          <button class="btn-red" style="flex:1" onclick="openBuilder('${s.id}','new')">現場快速建單</button>
        </div>`:""}
      `}

      ${isBuilding ? renderBuilder(s) : ""}
    </div>`;
}

function renderBuilder(s){
  return `
    <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
      <b style="font-size:15px">${builder.mode==='addon'?'追加品項':builder.mode==='edit'?(isProvisional()?'調整預抓數量(全部歸0=店家不叫貨)':'編輯訂單(數量歸0=移除該品項)'):builder.mode==='pre'?'預抓數量(計入當日總計,到現場再調整)':'建立訂單'}</b>
      ${builder.priceList.map(p=>{
        const q = builder.cart[p.id]||0;
        const ucls = p.unit.includes('袋')?'bag':p.unit.includes('杯')?'cup':'other';
        return `<div class="qtyrow">
          <span style="font-size:16px"><span class="utag ${ucls}">${esc(p.unit)}</span>${esc(p.name)} <span class="dim" style="font-size:14px">$${p.price}</span></span>
          <div class="ctrl">
            <button onclick="chgQty('${p.id}',-1)">−</button>
            <input class="n" type="number" inputmode="numeric" min="0" value="${q}"
              onchange="setBQty('${p.id}',this.value)" onfocus="this.select()" />
            <button class="p" onclick="chgQty('${p.id}',1)">＋</button>
          </div>
        </div>`}).join("")}
      ${(()=>{
        const g = bGiftInfo();
        if (!g.bagGift && !g.cupGift) return "";
        const rows = [];
        if (g.bagGift) rows.push({cls:"袋",th:g.bagTh,got:g.bagGift,sel:g.selBag});
        if (g.cupGift) rows.push({cls:"杯",th:g.cupTh,got:g.cupGift,sel:g.selCup});
        return `<div style="margin-top:10px;padding:10px;border:1px solid #3b82f6;border-radius:10px;background:rgba(59,130,246,.10)">
          <b style="color:#7eb3ff;font-size:15px">🎁 搭贈</b>
          ${rows.map(r=>`
            <div style="font-size:15px;margin-top:6px">滿${r.th}${r.cls} 可送 <b style="color:#7eb3ff">${r.got}</b>${r.cls}
              ${r.sel<r.got?`<span class="amber">(還可選${r.got-r.sel})</span>`:'<span class="green">✓</span>'}</div>
            ${builder.priceList.filter(p=>(p.unit||"").includes(r.cls)).map(p=>{
              const gq = builder.giftCart[p.id]||0;
              return `<div class="qtyrow" style="padding:3px 0">
                <span style="font-size:15px">${esc(p.name)}</span>
                <div class="ctrl">
                  <button onclick="chgBGift('${p.id}',-1,'${r.cls}')">−</button>
                  <span style="min-width:24px;text-align:center;font-family:monospace;font-size:16px;color:${gq?'#7eb3ff':'var(--text3)'}">${gq}</span>
                  <button onclick="chgBGift('${p.id}',1,'${r.cls}')" style="background:rgba(59,130,246,.25);border-color:#3b82f6;color:#7eb3ff">＋</button>
                </div>
              </div>`}).join("")}`).join("")}
        </div>`;
      })()}
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--border);margin-top:6px">
        <span class="dim">合計</span>
        <b style="font-size:18px">$${builder.priceList.reduce((s,p)=>s+(builder.cart[p.id]||0)*p.price,0).toLocaleString()}</b>
      </div>
      <div class="rowbtns">
        <button class="btn2" onclick="closeBuilder()">取消</button>
        <button class="btn" onclick="submitBuilder()">${builder.mode==='addon'?'確認追加':builder.mode==='edit'?'儲存變更':builder.mode==='pre'?'儲存預抓':'建立訂單'}</button>
      </div>
    </div>`;
}

// ====== 操作 ======
window.chgDate = (v)=>{ viewDate=v; builder=null; sessionStorage.removeItem("driverFocus"); load(); };
async function loadPrices(storeId){
  try {
    const r = await api("store_prices",{params:{storeId}});
    return Array.isArray(r) ? { products:r, giftBag:null, giftCup:null } : r;
  } catch(e){ alert("載入價格失敗:"+e.message); return null; }
}
function bGiftInfo(){
  let bagQty=0, cupQty=0, selBag=0, selCup=0;
  for (const p of builder.priceList){
    const q = builder.cart[p.id]||0, g = builder.giftCart[p.id]||0;
    const u = p.unit||"";
    if (u.includes("袋")){ bagQty+=q; selBag+=g; }
    else if (u.includes("杯")){ cupQty+=q; selCup+=g; }
  }
  const bagTh = builder.giftBag, cupTh = builder.giftCup;
  return { bagTh, cupTh, selBag, selCup,
    bagGift: (bagTh&&bagTh>0)?Math.floor(bagQty/bagTh):0,
    cupGift: (cupTh&&cupTh>0)?Math.floor(cupQty/cupTh):0 };
}
window.chgBGift = (pid,d,cls)=>{
  const g = bGiftInfo();
  const max = cls==="袋"?g.bagGift:g.cupGift;
  const sel = cls==="袋"?g.selBag:g.selCup;
  const cur = builder.giftCart[pid]||0;
  if (d>0 && sel>=max) return alert(`${cls}裝贈品最多 ${max}`);
  builder.giftCart[pid] = Math.max(0, cur+d);
  if (!builder.giftCart[pid]) delete builder.giftCart[pid];
  render();
};

function isProvisional(){
  if (!builder) return false;
  const s = data.stores.find(x=>x.id===builder.storeId) || (data.extraStores||[]).find(x=>x.id===builder.storeId);
  return !!(s && s.order && s.order.status==='provisional');
}
window.openBuilder = async (storeId,mode,orderId)=>{
  const r = await loadPrices(storeId);
  if (!r) return;
  builder={storeId,mode,orderId,cart:{},giftCart:{},priceList:r.products,giftBag:r.giftBag,giftCup:r.giftCup};
  render();
};
window.openEditBuilder = async (storeId,orderId)=>{
  const s = data.stores.find(x=>x.id===storeId) || (data.extraStores||[]).find(x=>x.id===storeId);
  const cart = {}, giftCart = {};
  if (s && s.order) for (const it of s.order.items){
    if (it.isGift) giftCart[it.productId]=it.qty; else cart[it.productId]=it.qty;
  }
  const r = await loadPrices(storeId);
  if (!r) return;
  builder={storeId,mode:'edit',orderId,cart,giftCart,priceList:r.products,giftBag:r.giftBag,giftCup:r.giftCup};
  render();
};
window.closeBuilder = ()=>{ builder=null; render(); };
window.chgQty = (pid,d)=>{ builder.cart[pid]=Math.max(0,(builder.cart[pid]||0)+d); render(); };
window.setBQty = (pid,v)=>{ builder.cart[pid]=Math.max(0,Math.floor(Number(v)||0)); render(); };

let submitting = false; // 防連點重複送出
window.submitBuilder = async ()=>{
  if (submitting) return;
  const items = Object.entries(builder.cart).filter(([,q])=>q>0).map(([productId,qty])=>({productId,qty}));
  for (const [productId,qty] of Object.entries(builder.giftCart||{})) {
    if (qty>0) items.push({productId,qty,isGift:true});
  }
  if (!items.length) {
    // 預抓訂單允許全部歸零(代表店家最終不叫貨)
    if (!(builder.mode==="edit" && isProvisional())) return alert("請選擇品項");
    if (!confirm("全部歸零將取消此筆預抓,確定?")) return;
  }
  submitting = true;
  // 按鈕即時變灰,避免視覺上還能按
  const btns = document.querySelectorAll(".rowbtns button");
  btns.forEach(b=>{ b.disabled = true; });
  const submitBtn = btns[btns.length-1];
  if (submitBtn) submitBtn.textContent = "送出中…";
  try {
    if (builder.mode==="new" || builder.mode==="pre"){
      await api("create_onsite",{body:{storeId:builder.storeId,date:viewDate,items,provisional:builder.mode==="pre"}});
    } else if (builder.mode==="edit"){
      await api("edit_order",{body:{orderId:builder.orderId,storeId:builder.storeId,items}});
    } else {
      await api("addon",{body:{orderId:builder.orderId,storeId:builder.storeId,items}});
    }
    const sid = builder.storeId;
    builder=null;
    load(sid);
  } catch(e){
    alert(e.message);
    render(); // 還原按鈕狀態
  } finally {
    submitting = false;
  }
};

window.markDelivered = async (orderId, storeId)=>{
  if (submitting) return;
  if (!confirm("確認此店已送達?")) return;
  submitting = true;
  try { await api("mark_delivered",{body:{orderId}}); load(storeId); }
  catch(e){ alert(e.message); }
  finally { submitting = false; }
};

window.openExchange = async (storeId)=>{
  const r = await loadPrices(storeId);
  if (!r) return;
  const list = r.products || [];
  const cups = list.filter(p=>(p.unit||"").includes("杯"));
  const opts = (cups.length?cups:list).map(p=>`<option value="${p.id}">${esc(p.name)} (${esc(p.unit)})</option>`).join("");
  const html = `
    <div style="position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:flex-end"
         onclick="if(event.target===this)closeExchange()">
      <div style="background:var(--card);width:100%;border-radius:16px 16px 0 0;padding:16px">
        <b style="font-size:17px">🔄 過期換貨登記</b>
        <div class="dim" style="font-size:14px;margin:4px 0 12px">回收過期品、補新品給店家(不計費用)</div>
        <div style="margin-bottom:10px">
          <label class="dim" style="font-size:14px">品項</label>
          <select id="ex_pid" style="width:100%;margin-top:4px;font-size:16px;padding:9px">${opts}</select>
        </div>
        <div style="display:flex;gap:10px;margin-bottom:10px">
          <div style="flex:1">
            <label class="dim" style="font-size:14px">回收(過期)</label>
            <input id="ex_ret" type="number" inputmode="numeric" min="0" value="0" style="width:100%;margin-top:4px;font-size:18px;padding:9px;text-align:center" onfocus="this.select()"/>
          </div>
          <div style="flex:1">
            <label class="dim" style="font-size:14px">補貨(新品)</label>
            <input id="ex_rep" type="number" inputmode="numeric" min="0" value="0" style="width:100%;margin-top:4px;font-size:18px;padding:9px;text-align:center" onfocus="this.select()"/>
          </div>
        </div>
        <input id="ex_note" placeholder="備註(選填)" style="width:100%;margin-bottom:12px;font-size:15px;padding:9px"/>
        <div style="display:flex;gap:8px">
          <button class="btn2" style="flex:1;padding:12px" onclick="closeExchange()">取消</button>
          <button class="btn" style="flex:2;padding:12px" onclick="submitExchange('${storeId}')">確認登記</button>
        </div>
      </div>
    </div>`;
  let m = document.getElementById("exModal");
  if (!m){ m=document.createElement("div"); m.id="exModal"; document.body.appendChild(m); }
  m.innerHTML = html;
};
window.closeExchange = ()=>{ const m=document.getElementById("exModal"); if(m)m.innerHTML=""; };
window.submitExchange = async (storeId)=>{
  if (submitting) return;
  const productId = document.getElementById("ex_pid").value;
  const returned = document.getElementById("ex_ret").value;
  const replaced = document.getElementById("ex_rep").value;
  const note = document.getElementById("ex_note").value;
  if (Number(returned)<=0 && Number(replaced)<=0) return alert("請填寫回收或補貨數量");
  submitting = true;
  try {
    await api("add_exchange",{body:{storeId,productId,date:viewDate,returned,replaced,note}});
    closeExchange();
    load(storeId);
  } catch(e){ alert("登記失敗:"+e.message); }
  finally { submitting = false; }
};

// ====== 記住目前檢視位置(手機瀏覽器閒置後重新載入仍能回到原處) ======
let scrollTimer = null;
window.addEventListener("scroll", ()=>{
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(()=>{
    const cards = document.querySelectorAll(".scard");
    const mid = window.innerHeight/2;
    let best=null, bestD=Infinity;
    for (const c of cards){
      const r = c.getBoundingClientRect();
      const d = Math.abs(r.top + r.height/2 - mid);
      if (d < bestD){ bestD=d; best=c; }
    }
    if (best) sessionStorage.setItem("driverFocus", best.id.replace(/^s-/,""));
  }, 250);
});

// ====== 啟動 ======
if (CRED) load(sessionStorage.getItem("driverFocus")||undefined); else renderLogin();
</script>
